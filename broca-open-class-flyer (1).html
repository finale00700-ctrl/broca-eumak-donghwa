<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브로카 음악동화 — 오픈수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --navy: #12142B;
    --navy-deep: #0A0B1C;
    --lavender: #B497D6;
    --coral: #E8735C;
    --moon: #F5C518;
    --ink: #F4F1EA;
    --muted: #9C9BB8;
    --line: rgba(180,151,214,0.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--navy); color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  h1{ font-family:'Gowun Batang', serif; font-weight:700; letter-spacing:-0.01em; }

  .sky{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star{ fill:var(--ink); opacity:0.5; animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:0.2;} 50%{opacity:0.6;} }
  .bg-glow{
    position:fixed; top:-6%; left:50%; transform:translateX(-50%); z-index:0; pointer-events:none;
    width:260px; height:260px; border-radius:50%; background:var(--moon); opacity:0.14; filter:blur(10px);
  }

  .poster{
    position:relative; z-index:1;
    min-height:100svh;
    max-width:460px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding: calc(30px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    gap:18px;
  }

  .eyebrow{ font-size:18px; font-weight:700; color:var(--coral); }
  .poster h1{ font-size:clamp(28px,7.5vw,38px); line-height:1.25; }
  .sub{ color:var(--muted); font-size:14px; max-width:320px; }
  .story-name{ font-family:'Gowun Batang', serif; color:var(--lavender); font-size:14px; }

  .moon-row{ display:flex; justify-content:center; gap:7px; }
  .mini-moon{ width:16px; height:16px; border-radius:50%; background:var(--moon); position:relative; overflow:hidden; }
  .mini-moon::after{ content:''; position:absolute; inset:0; border-radius:50%; background:var(--navy-deep); transform:translateX(calc(var(--p) * 100%)); }

  .venn{ position:relative; width:230px; aspect-ratio:1/0.82; margin:4px 0; }
  .circle{
    position:absolute; width:62%; aspect-ratio:1/1; border-radius:50%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:11.5px; padding:10px; mix-blend-mode:screen;
  }
  .circle span{ mix-blend-mode:normal; }
  .c1{ background:rgba(180,151,214,0.55); left:2%; top:10%; }
  .c2{ background:rgba(232,115,92,0.55); right:2%; top:10%; }
  .c3{ background:rgba(245,197,24,0.5); left:50%; bottom:0; transform:translateX(-50%); }
  .venn-center{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    font-family:'Gowun Batang', serif; font-size:11px; color:var(--ink);
    background:var(--navy); border:1px solid var(--line); border-radius:50%;
    width:62px; height:62px; display:flex; align-items:center; justify-content:center; text-align:center;
    z-index:2; line-height:1.25;
  }

  .card{
    width:100%; background:var(--navy-deep); border:1px solid var(--line); border-radius:16px;
    padding:18px 22px;
  }
  .card h2{ font-family:'Gowun Batang', serif; font-size:16px; margin-bottom:12px; }
  .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:var(--muted); }
  .row .v{ font-weight:600; color:var(--ink); text-align:right; }

  .cta-text{ color:var(--muted); font-size:13.5px; }
  .btn{
    display:block; width:100%; background:var(--moon); color:var(--navy-deep);
    font-weight:700; font-size:15.5px; padding:15px 0; border-radius:14px; text-decoration:none;
  }
  .btn:active{ transform:translateY(1px); }
  .footer{ color:var(--muted); font-size:11.5px; margin-top:auto; padding-top:6px; }

  @media(prefers-reduced-motion: reduce){ .star{ animation:none !important; } }
  @media(max-height:680px){
    .poster{ gap:12px; }
    .venn{ width:190px; }
  }
</style>
</head>
<body>

<svg class="sky" width="100%" height="100%">
  <circle class="star" cx="14%" cy="10%" r="1.5"/>
  <circle class="star" cx="82%" cy="8%" r="1.3"/>
  <circle class="star" cx="24%" cy="20%" r="1.6"/>
  <circle class="star" cx="70%" cy="16%" r="1.2"/>
  <circle class="star" cx="8%" cy="30%" r="1.4"/>
  <circle class="star" cx="90%" cy="28%" r="1.3"/>
</svg>
<div class="bg-glow"></div>

<div class="poster">

  <p class="eyebrow">오픈수업 초대</p>
  <h1>브로카 음악동화</h1>
  <p class="sub">다섯 살에서 일곱 살, 이야기로 먼저 듣고 말하는 시간</p>
  <p class="story-name">첫 번째 이야기 · 콕콕, 달빛 친구</p>

  <div class="moon-row">
    <div class="mini-moon" style="--p:0"></div>
    <div class="mini-moon" style="--p:0.2"></div>
    <div class="mini-moon" style="--p:0.4"></div>
    <div class="mini-moon" style="--p:0.6"></div>
    <div class="mini-moon" style="--p:0.8"></div>
    <div class="mini-moon" style="--p:1"></div>
  </div>

  <div class="venn">
    <div class="circle c1"><span>음악동화</span></div>
    <div class="circle c2"><span>스케일피아노</span></div>
    <div class="circle c3"><span>미니하프</span></div>
    <div class="venn-center">한 아이의<br>3개월</div>
  </div>

  <div class="card">
    <h2>오픈수업 안내</h2>
    <div class="row"><span class="k">날짜</span><span class="v">10월 24일 토요일</span></div>
    <div class="row"><span class="k">시간</span><span class="v">오전 11시</span></div>
    <div class="row"><span class="k">장소</span><span class="v">어울림마당</span></div>
  </div>

  <p class="cta-text">아이와 함께, 달빛 아래 첫 이야기를 열어보세요.</p>
  <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLScQPSBKokXFHpChpK6i5eDOROnQT2qbaqrVajaKyPfSb9G7eg/viewform" target="_blank" rel="noopener">오픈수업 신청하기</a>

  <p class="footer">엠아이음악 · 브레인업뮤즈연구소</p>

</div>

</body>
</html>
